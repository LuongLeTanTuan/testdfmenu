name: Build dylib & deb
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDKs
        run: |
          git clone --quiet https://github.com/theos/sdks.git $THEOS/sdks

      - name: Compile and Package (Rootless / Rootful)
        run: |
          # Build the dylib
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          # Build rootful fallback
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb-package
          path: packages/*.deb

      - name: Upload .dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/debug/*.dylib
        if: always()

      - name: Create Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            .theos/obj/debug/*.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
