name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  dylibs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build all libraries
        run: |
          set -euo pipefail
          make clean || true
          make FINALPACKAGE=1 DEBUG=0
          # A green build that emitted nothing is worse than a red one.
          for n in PxMenu PxMenuLite AnoMute; do
            test -f ".theos/obj/$n.dylib" || { echo "missing $n.dylib"; exit 1; }
          done
          ls -lh .theos/obj/*.dylib
          for f in .theos/obj/*.dylib; do
            echo "--- $f"
            xcrun vtool -show-build "$f" 2>/dev/null | head -5 || true
          done

      - name: Upload dylibs
        uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: .theos/obj/*.dylib
          if-no-files-found: error
